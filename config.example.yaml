install:
  version: "3.5.3"
  architecture: "x86_64"
  libc: "gnu"
  sha256: "f3a5a3ad022243e456f9fac20b8e1acf2ef14654e6b104b2766235739c41d5d2"
  service_name: "telemt"
  user: "telemt"
  group: "telemt"
  binary_path: "/bin/telemt"
  config_path: "/etc/telemt/telemt.toml"
  work_dir: "/opt/telemt"
  backup_root: "/var/backups/telemt-setup"
  state_root: "/var/lib/telemt-setup"
  manage_ufw: false

server:
  listen_ip: "0.0.0.0"
  port: 443
  max_connections: 256
  api_listen: "127.0.0.1:9091"
  metrics_listen: "127.0.0.1:9090"

links:
  # Replace with the public IPv4 address or DNS name of the new VM.
  public_host: "CHANGE_ME"
  public_port: 443

proxy:
  use_middle_proxy: true
  log_level: "normal"
  modes:
    classic: false
    secure: false
    tls: true
  tls_domain: "petrovich.ru"
  mask: true
  tls_emulation: true

# Optional outbound route from Telemt to Telegram. An empty list preserves
# Telemt's default direct egress. With SOCKS5 enabled, Telegram/DC/ME uses only
# that unscoped route; TLS-front metadata and masking egress stay direct from
# this VM automatically. No additional YAML routing fields are needed.
upstreams: []
# upstreams:
#   - type: "socks5"
#     address: "proxy.example.invalid:1080"
#     username: "<PROXY_USER>"
#     password: "<PROXY_PASSWORD>"
#     weight: 1
#     enabled: true

users:
  hello:
    # GENERATE creates a random 32-hex secret on first install and preserves it
    # on idempotent reruns for the same username.
    secret: "GENERATE"
    ad_tag: null
    max_unique_ips: null

probes:
  timeout_seconds: 10
