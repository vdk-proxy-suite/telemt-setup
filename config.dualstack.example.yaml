schema_version: 2
instance:
  id: dev-dual
install:
  version: "3.5.16"
  architecture: x86_64
  libc: gnu
  sha256: e6f46b2f3becf29bfd555cec8a059e429f7c082c1af402499b3a7940cf8ebd34
  manage_ufw: false
server:
  listen_ips: ["0.0.0.0", "::"]
  port: 24443
  max_connections: 256
  api_listen: "127.0.0.1:24991"
  metrics_listen: "127.0.0.1:24990"
links:
  primary: dns
  # Replace these documentation hosts before deployment. DNS must have A+AAAA.
  endpoints:
    - id: dns
      host: proxy.example.org
      port: 24443
      families: [ipv4, ipv6]
    - id: ipv4
      host: "192.0.2.10"
      port: 24443
      families: [ipv4]
    - id: ipv6
      host: "2001:db8::10"
      port: 24443
      families: [ipv6]
# Inbound IPv6 does not require IPv6 egress through the SOCKS/Telegram route.
outbound:
  families: [ipv4]
  prefer: ipv4
proxy:
  use_middle_proxy: false
  log_level: normal
  modes:
    classic: false
    secure: false
    tls: true
  tls_domain: petrovich.ru
  mask: true
  tls_emulation: true
users:
  hello:
    secret: GENERATE
    ad_tag: null
    max_unique_ips: null
upstreams: []
probes:
  timeout_seconds: 15
